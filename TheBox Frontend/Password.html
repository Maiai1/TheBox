<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Box Seguros – Cambiá tu contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #2563eb;
            --blue-dark: #1e4fc4;
            --navy: #16325c;
            --ink: #111827;
            --text: #374151;
            --muted: #6b7280;
            --green: #22a06b
        }

        html {
            font-size: clamp(14px,1.25vw,32px)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
            color: var(--text);
            min-height: 100vh;
            background: radial-gradient(60rem 30rem at 85% 75%,rgba(147,197,253,.35),transparent 70%), radial-gradient(50rem 28rem at 10% 100%,rgba(191,219,254,.45),transparent 70%), linear-gradient(135deg,#f0f7ff 0%,#e6f0fc 55%,#dbe9fb 100%);
            display: flex;
            flex-direction: column
        }

        header {
            background: rgba(255,255,255,.7);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid #e3eaf6;
            padding: 1rem 1.5rem
        }

        .bar {
            max-width: 30rem;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .6rem
        }

        .brand-name {
            font-weight: 800;
            font-size: 1.45rem;
            letter-spacing: .03rem;
            color: var(--navy);
            line-height: 1
        }

        .brand-sub {
            font-size: .55rem;
            letter-spacing: .1rem;
            color: var(--navy);
            margin-top: .25rem;
            font-weight: 500
        }

        .user {
            display: flex;
            align-items: center;
            gap: 1.1rem;
            color: var(--ink);
            font-size: .9rem
        }

            .user button {
                display: flex;
                align-items: center;
                gap: .35rem;
                background: none;
                border: 0;
                font: inherit;
                color: inherit;
                cursor: pointer
            }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.6rem 1rem 2rem
        }

        .card {
            width: 100%;
            max-width: 25rem;
            background: #fff;
            border-radius: .9rem;
            padding: 1.1rem 1.4rem 1.4rem;
            box-shadow: 0 .6rem 2rem rgba(30,60,120,.12);
            border: 1px solid #edf1f8
        }

        .lock {
            width: 3.1rem;
            height: 3.1rem;
            border-radius: 50%;
            background: #dbe8fb;
            display: grid;
            place-items: center;
            margin: 0 auto .7rem
        }

        h1 {
            text-align: center;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: .6rem
        }

        .sub {
            text-align: center;
            font-size: .88rem;
            line-height: 1.45;
            color: var(--text);
            margin: 0 auto 1.1rem;
            max-width: 20rem
        }

        label {
            display: block;
            font-size: .82rem;
            color: var(--ink);
            margin-bottom: .35rem
        }

        .field {
            display: flex;
            align-items: center;
            gap: .6rem;
            border: 1px solid #dfe4ec;
            border-radius: .55rem;
            padding: 0 .8rem;
            height: 2.6rem;
            background: #fafbfd;
            margin-bottom: .85rem;
            box-shadow: 0 1px 2px rgba(0,0,0,.03)
        }

            .field:focus-within {
                border-color: var(--blue);
                box-shadow: 0 0 0 .18rem rgba(37,99,235,.15);
                background: #fff
            }

            .field input {
                flex: 1;
                min-width: 0;
                border: 0;
                background: transparent;
                font: inherit;
                font-size: .9rem;
                color: var(--ink);
                outline: none;
                letter-spacing: .05rem
            }

            .field .eye {
                background: none;
                border: 0;
                cursor: pointer;
                display: grid;
                place-items: center;
                padding: .1rem
            }

        .rules {
            list-style: none;
            display: grid;
            gap: .4rem;
            margin: .2rem 0 1.1rem .2rem
        }

            .rules li {
                display: flex;
                align-items: center;
                gap: .55rem;
                font-size: .82rem;
                color: var(--ink)
            }

            .rules .ck {
                flex: none;
                width: 1.05rem;
                height: 1.05rem;
                border-radius: 50%;
                background: var(--green);
                display: grid;
                place-items: center;
                transition: background .2s
            }

            .rules li.off .ck {
                background: #cbd2dc
            }

        .btn {
            width: 100%;
            height: 2.7rem;
            border: 0;
            border-radius: .55rem;
            background: var(--blue);
            color: #fff;
            font: inherit;
            font-weight: 600;
            font-size: .95rem;
            cursor: pointer
        }

            .btn:hover {
                background: var(--blue-dark)
            }

        .msg {
            text-align: center;
            font-size: .8rem;
            margin-top: .7rem;
            min-height: 1em;
            color: #b42318
        }

        @media (max-width:600px) {
            html {
                font-size: 16px
            }
        }
    </style>
    <script src="pwa.js" defer></script>
    <script src="demo.js"></script>
</head>
<body>

    <header>
        <div class="bar">
            <div class="brand">
                <svg style="width:2.6rem;height:2.6rem" viewBox="0 0 46 46" fill="none">
                    <path d="M23 3 41 12.5v21L23 43 5 33.5v-21L23 3Z" fill="#1d4f9f" />
                    <path d="M23 3 41 12.5 23 22 5 12.5 23 3Z" fill="#3b82f6" />
                    <path d="M23 22v21L5 33.5v-21L23 22Z" fill="#16325c" />
                    <rect x="18" y="26" width="10" height="8" rx="1.5" fill="#fff" />
                    <path d="M20 26v-2.5a3 3 0 0 1 6 0V26" stroke="#fff" stroke-width="1.6" fill="none" />
                </svg>
                <div><div class="brand-name">THE BOX</div><div class="brand-sub">GESTIÓN DE SEGUROS</div></div>
            </div>
            <div class="user">
                <svg style="width:1.2rem;height:1.2rem" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15L6 17Z" /><path d="M10 21a2 2 0 0 0 4 0" /></svg>
                <button type="button">
                    <span id="user-name">Juan Pérez</span>
                    <svg style="width:.8rem;height:.8rem" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="card">
            <div class="lock">
                <svg style="width:1.5rem;height:1.5rem" viewBox="0 0 24 24" fill="none" stroke="#1d4f9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="11" width="15" height="10" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /><circle cx="12" cy="16" r="1" fill="#1d4f9f" /></svg>
            </div>
            <h1>Cambiá tu contraseña</h1>
            <p class="sub">Por tu seguridad, te pedimos que cambies la contraseña provisoria que te asignamos.</p>

            <form id="form" novalidate>
                <label for="actual">Contraseña actual</label>
                <div class="field">
                    <svg class="key" style="width:1.2rem;height:1.2rem" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="12" r="2.5" /><path d="M9 12h11M17 12v3M14 12v2" /></svg>
                    <input id="actual" type="password" value="" autocomplete="current-password">
                    <button type="button" class="eye" aria-label="Mostrar contraseña"></button>
                </div>

                <label for="nueva">Nueva contraseña</label>
                <div class="field">
                    <svg class="key" style="width:1.2rem;height:1.2rem" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="12" r="2.5" /><path d="M9 12h11M17 12v3M14 12v2" /></svg>
                    <input id="nueva" type="password" value="" autocomplete="new-password">
                    <button type="button" class="eye" aria-label="Mostrar contraseña"></button>
                </div>

                <label for="confirmar">Confirmar nueva contraseña</label>
                <div class="field">
                    <svg class="key" style="width:1.2rem;height:1.2rem" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="12" r="2.5" /><path d="M9 12h11M17 12v3M14 12v2" /></svg>
                    <input id="confirmar" type="password" value="" autocomplete="new-password">
                    <button type="button" class="eye" aria-label="Mostrar contraseña"></button>
                </div>

                <ul class="rules">
                    <li id="r-len"><span class="ck"><svg style="width:.65rem;height:.65rem" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7" /></svg></span>Mínimo 8 caracteres</li>
                    <li id="r-mix"><span class="ck"><svg style="width:.65rem;height:.65rem" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7" /></svg></span>Al menos una letra y un número</li>
                    <li id="r-old"><span class="ck"><svg style="width:.65rem;height:.65rem" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7" /></svg></span>No puede ser igual a tus últimas 3 contraseñas</li>
                </ul>

                <button class="btn" type="submit">Guardar contraseña</button>
                <p class="msg" id="msg" role="alert"></p>
            </form>
        </section>
    </main>

    <script>
        const EYE_OFF = '<svg style="width:1.2rem;height:1.2rem" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';
        const EYE_ON = '<svg style="width:1.2rem;height:1.2rem" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';

        document.querySelectorAll('.eye').forEach(btn => {
            const input = btn.parentElement.querySelector('input');
            btn.innerHTML = EYE_OFF;
            btn.addEventListener('click', () => {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.innerHTML = show ? EYE_ON : EYE_OFF;
                btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        });

        const nueva = document.getElementById('nueva'), conf = document.getElementById('confirmar'),
            actual = document.getElementById('actual'), msg = document.getElementById('msg');
        function check() {
            const v = nueva.value;
            document.getElementById('r-len').classList.toggle('off', v.length < 8);
            document.getElementById('r-mix').classList.toggle('off', !(/[A-Za-z]/.test(v) && /\d/.test(v)));
        }
        nueva.addEventListener('input', check); check();

        function comprobarCoincidencia() {
            msg.style.color = '#b42318';
            msg.textContent = (conf.value && conf.value !== nueva.value) ? 'Las contraseñas nuevas no coinciden.' : '';
        }
        nueva.addEventListener('input', comprobarCoincidencia);
        conf.addEventListener('input', comprobarCoincidencia);

        const API = 'http://localhost:5080';
        const PAGINA_LOGIN = 'LogIn.html';
        const PAGINA_PORTAL = 'Inicio.html';

        const token = sessionStorage.getItem('token');
        if (!token) location.replace(PAGINA_LOGIN);
        document.getElementById('user-name').textContent = sessionStorage.getItem('nombre') || '';

        document.getElementById('form').addEventListener('submit', async e => {
            e.preventDefault();
            msg.style.color = '#b42318';
            msg.textContent = '';
            const btn = e.target.querySelector('button[type=submit]');
            const v = nueva.value;
            if (v.length < 8 || !/[A-Za-z]/.test(v) || !/\d/.test(v)) { msg.textContent = 'La nueva contraseña no cumple los requisitos.'; return; }
            if (v !== conf.value) { msg.textContent = 'Las contraseñas nuevas no coinciden.'; return; }
            btn.disabled = true;
            try {
                const res = await fetch(API + '/api/auth/cambiar-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ passwordActual: actual.value, passwordNueva: nueva.value, confirmacion: conf.value })
                });
                if (res.status === 401) { sessionStorage.clear(); location.replace(PAGINA_LOGIN); return; }
                const data = await res.json();
                if (!res.ok) { msg.textContent = (data.errores || ['No pudimos guardar la contraseña.']).join(' '); return; }
                sessionStorage.setItem('token', data.token);
                msg.style.color = '#177a52';
                msg.textContent = 'Contraseña guardada.';
                setTimeout(() => location.href = PAGINA_PORTAL, 800);
            } catch {
                msg.textContent = 'No pudimos conectar con el servidor. Probá de nuevo en unos minutos.';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
